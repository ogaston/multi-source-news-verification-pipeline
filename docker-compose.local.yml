# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Scheduler cadence (America/Santo_Domingo, see deploy/crontab):
#   ingest      — every 3 hours
#   preprocess  — every 3 days at 05:15
#   story_audit — every 3 days at 05:30
#
# MCP:     http://localhost:7000/mcp  (Authorization: Bearer $MCP_API_KEY)
# Admin:   http://localhost:7001/admin
# API:     http://localhost:7002/api/articles
# Website: http://localhost:7003
# Schema migrate runs automatically via the `migrate` service on `up`.
# One-shot ingest:     docker compose -f docker-compose.yml -f docker-compose.local.yml run --rm scheduler python -m ingestion.ingestor
# One-shot preprocess: docker compose -f docker-compose.yml -f docker-compose.local.yml run --rm scheduler python -m preprocessing.runner
# One-shot story-audit: docker compose -f docker-compose.yml -f docker-compose.local.yml run --rm scheduler python -m audit.story_audit

services:
  postgres:
    container_name: ojo-critico-postgres-local
    ports:
      - "5432:5432"
    volumes:
      # Creates news_test on first volume init only. Existing volumes:
      # docker compose -f docker-compose.yml -f docker-compose.local.yml exec postgres \
      #   psql -U news -d news -c 'CREATE DATABASE news_test;'
      - ./deploy/postgres/create-news-test.sql:/docker-entrypoint-initdb.d/01-create-news-test.sql:ro

  migrate:
    container_name: ojo-critico-migrate-local

  mcp:
    container_name: ojo-critico-mcp-local
    ports:
      - "${MCP_PORT:-7000}:${MCP_PORT:-7000}"
    networks: !override
      - default
    labels: !override []

  scheduler:
    container_name: ojo-critico-scheduler-local
    environment:
      DEFAULT_URL_LIMIT: ${DEFAULT_URL_LIMIT:-15}

  admin:
    container_name: ojo-critico-admin-local
    ports:
      - "${ADMIN_PORT:-7001}:${ADMIN_PORT:-7001}"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-local-dev-secret-change-me}
    networks: !override
      - default
    labels: !override []

  api:
    container_name: ojo-critico-api-local
    ports:
      - "${API_PORT:-7002}:${API_PORT:-7002}"
    environment:
      WEBSITE_CORS_ORIGINS: ${WEBSITE_CORS_ORIGINS:-http://localhost:7003}
    networks: !override
      - default
    labels: !override []

  website:
    container_name: ojo-critico-website-local
    build:
      args:
        WEBSITE_URL: ${WEBSITE_URL:-http://localhost:7003}
    ports:
      - "${WEBSITE_PORT:-7003}:${WEBSITE_PORT:-7003}"
    environment:
      WEBSITE_URL: ${WEBSITE_URL:-http://localhost:7003}
    networks: !override
      - default
    labels: !override []
