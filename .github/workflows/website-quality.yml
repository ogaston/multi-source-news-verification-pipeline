name: Website quality

on:
  pull_request:
    paths:
      - 'website/**'
      - 'api/**'
      - 'common/**'
      - '.github/workflows/website-quality.yml'
  push:
    branches: [main]

jobs:
  seo-mobile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news
          POSTGRES_DB: news
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U news -d news"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: website
    env:
      API_KEY: ci-test-api-key
      DATABASE_URL: postgresql+psycopg://news:news@127.0.0.1:5432/news
      WEBSITE_API_URL: http://127.0.0.1:7002
      WEBSITE_API_KEY: ci-test-api-key
      WEBSITE_URL: http://127.0.0.1:7003

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install API runtime
        run: pip install -r ../api/requirements.txt alembic==1.16.4
      - name: Install website dependencies
        run: npm ci

      - name: Lint and type-check
        run: npm run lint && npm run typecheck

      - name: Migrate and seed database
        working-directory: .
        run: alembic upgrade head && python -m scripts.seed_demo
      - name: Start API
        working-directory: .
        run: python -m uvicorn api.app:app --host 127.0.0.1 --port 7002 > /tmp/ojo-api.log 2>&1 &
      - name: Build website
        run: npm run build
      - name: Start website
        env:
          WEBSITE_ANALYTICS: '0'
        run: npm start > /tmp/ojo-website.log 2>&1 &
      - name: Wait for website
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:7003/ >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Warm Lighthouse URLs
        run: |
          # Prime Next.js/API caches so the first LHCI run is not a cold SSR miss.
          for url in \
            http://127.0.0.1:7003/ \
            http://127.0.0.1:7003/articulo/reforma-presupuesto
          do
            for attempt in {1..10}; do
              curl --fail --silent "$url" >/dev/null && break
              sleep 1
              if [ "$attempt" -eq 10 ]; then
                echo "Failed to warm $url" >&2
                exit 1
              fi
            done
          done
      - name: Lighthouse mobile gate
        env:
          WEBSITE_ANALYTICS: '0'
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: website/.lighthouseci
