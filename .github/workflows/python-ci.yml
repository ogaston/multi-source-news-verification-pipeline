name: Python CI

on:
  pull_request:
    paths:
      - 'audit/**'
      - 'admin/**'
      - 'api/**'
      - 'common/**'
      - 'ingestion/**'
      - 'preprocessing/**'
      - 'mcp_app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'alembic/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/python-ci.yml'
  push:
    branches: [main]
    paths:
      - 'audit/**'
      - 'admin/**'
      - 'api/**'
      - 'common/**'
      - 'ingestion/**'
      - 'preprocessing/**'
      - 'mcp_app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'alembic/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/python-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news
          POSTGRES_DB: news
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U news -d news"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_KEY: ci-test-api-key
      TEST_DATABASE_URL: postgresql+psycopg://news:news@127.0.0.1:5432/news

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            admin/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r admin/requirements.txt ruff

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
