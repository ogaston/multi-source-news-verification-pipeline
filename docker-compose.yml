services:
  # Always-on MCP (streamable HTTP) behind Traefik
  mcp:
    build: .
    image: news-pipeline:latest
    container_name: news-pipeline-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_NAME: /data/dominican_news_repository.db
      CHROMA_PATH: /data/chroma_db
      DATA_DIR: /data/debug_json
      HF_HOME: /opt/hf_cache
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-8000}
      MCP_TRANSPORT: streamable-http
      MCP_API_KEY: ${MCP_API_KEY:-5cfb757b93c423b4bd8fcc6c65a5139304978503d5a1be38}
    volumes:
      - pipeline-data:/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.news-mcp.rule=Host(`${MCP_DOMAIN}`)
      - traefik.http.routers.news-mcp.entrypoints=web
      - traefik.http.services.news-mcp.loadbalancer.server.port=${MCP_PORT:-8000}
    command: ["python", "-m", "mcp_app.server"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', int(__import__('os').environ.get('MCP_PORT','8000'))), 2); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Always-on scheduler: ingest 4x/day + preprocess every 15m via supercronic
  scheduler:
    build: .
    image: news-pipeline:latest
    container_name: news-pipeline-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_NAME: /data/dominican_news_repository.db
      CHROMA_PATH: /data/chroma_db
      DATA_DIR: /data/debug_json
      HF_HOME: /opt/hf_cache
      TZ: America/Santo_Domingo
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pipeline-data:/data
    command: ["/usr/local/bin/supercronic", "/app/deploy/crontab"]

  # SQLAdmin UI for browsing SQLite tables (separate Traefik host)
  admin:
    build: ./admin
    image: news-pipeline-admin:latest
    container_name: news-pipeline-admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_NAME: /data/dominican_news_repository.db
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: ${ADMIN_PORT:-8001}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
    volumes:
      - pipeline-data:/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.news-admin.rule=Host(`${ADMIN_DOMAIN}`)
      - traefik.http.routers.news-admin.entrypoints=web
      - traefik.http.services.news-admin.loadbalancer.server.port=${ADMIN_PORT:-8001}
    command:
      [
        "uvicorn",
        "admin.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "${ADMIN_PORT:-8001}",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', int(__import__('os').environ.get('ADMIN_PORT','8001'))), 2); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pipeline-data:
    driver: local

networks:
  proxy:
    external: true
