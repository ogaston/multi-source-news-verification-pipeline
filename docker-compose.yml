services:
  postgres:
    image: postgres:16-alpine
    container_name: news-pipeline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news}
      POSTGRES_DB: ${POSTGRES_DB:-news}
    ports:
      - "${POSTGRES_HOST_PORT:-5436}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-news} -d ${POSTGRES_DB:-news}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot schema migration before app services start.
  migrate:
    build: .
    image: news-pipeline:latest
    container_name: news-pipeline-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:-news}@postgres:5432/${POSTGRES_DB:-news}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # Always-on MCP (streamable HTTP) behind Traefik
  mcp:
    build: .
    image: news-pipeline:latest
    container_name: news-pipeline-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:-news}@postgres:5432/${POSTGRES_DB:-news}
      CHROMA_PATH: /data/chroma_db
      DATA_DIR: /data/debug_json
      HF_HOME: /opt/hf_cache
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-7000}
      MCP_TRANSPORT: streamable-http
      MCP_API_KEY: ${MCP_API_KEY:-5cfb757b93c423b4bd8fcc6c65a5139304978503d5a1be38}
    volumes:
      - pipeline-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.news-mcp.rule=Host(`${MCP_DOMAIN}`)
      - traefik.http.routers.news-mcp.entrypoints=web
      - traefik.http.services.news-mcp.loadbalancer.server.port=${MCP_PORT:-7000}
    command: ["python", "-m", "mcp_app.server"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', int(__import__('os').environ.get('MCP_PORT','7000'))), 2); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Always-on scheduler: fast-test cadence via supercronic (see deploy/crontab)
  # Schema:  docker compose run --rm migrate  (also runs automatically on `up`)
  # Data:    docker compose run --rm scheduler python -m scripts.migrate_sqlite_to_postgres
  scheduler:
    build: .
    image: news-pipeline:latest
    container_name: news-pipeline-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:-news}@postgres:5432/${POSTGRES_DB:-news}
      DB_NAME: /data/dominican_news_repository.db
      CHROMA_PATH: /data/chroma_db
      DATA_DIR: /data/debug_json
      HF_HOME: /opt/hf_cache
      TZ: America/Santo_Domingo
    volumes:
      - pipeline-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/usr/local/bin/supercronic", "/app/deploy/crontab"]

  # SQLAdmin UI for browsing tables (separate Traefik host)
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: news-pipeline-admin:latest
    container_name: news-pipeline-admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:-news}@postgres:5432/${POSTGRES_DB:-news}
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: ${ADMIN_PORT:-7001}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.news-admin.rule=Host(`${ADMIN_DOMAIN}`)
      - traefik.http.routers.news-admin.entrypoints=web
      - traefik.http.services.news-admin.loadbalancer.server.port=${ADMIN_PORT:-7001}
    command:
      [
        "uvicorn",
        "admin.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "${ADMIN_PORT:-7001}",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', int(__import__('os').environ.get('ADMIN_PORT','7001'))), 2); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Public read API for the website
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: news-pipeline-api:latest
    container_name: news-pipeline-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:-news}@postgres:5432/${POSTGRES_DB:-news}
      API_PORT: ${API_PORT:-7002}
      API_USE_DB: ${API_USE_DB:-true}
      WEBSITE_CORS_ORIGINS: ${WEBSITE_CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.news-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.news-api.entrypoints=web
      - traefik.http.services.news-api.loadbalancer.server.port=${API_PORT:-7002}
    command:
      [
        "uvicorn",
        "api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "${API_PORT:-7002}",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', int(__import__('os').environ.get('API_PORT','7002'))), 2); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Next.js website — SSR fetches from api
  website:
    build:
      context: ./website
      args:
        WEBSITE_API_URL: ${WEBSITE_API_URL:-http://api:7002}
    image: news-pipeline-website:latest
    container_name: news-pipeline-website
    restart: unless-stopped
    environment:
      PORT: ${WEBSITE_PORT:-7003}
      WEBSITE_API_URL: ${WEBSITE_API_URL:-http://api:7002}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.news-website.rule=Host(`${WEBSITE_DOMAIN}`)
      - traefik.http.routers.news-website.entrypoints=web
      - traefik.http.services.news-website.loadbalancer.server.port=${WEBSITE_PORT:-7003}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+(process.env.PORT||7003),r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pipeline-data:
    driver: local
  postgres-data:
    driver: local

networks:
  proxy:
    external: true
