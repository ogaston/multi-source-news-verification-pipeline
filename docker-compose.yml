services:
  # Always-on MCP (streamable HTTP) behind Traefik
  mcp:
    build: .
    image: news-pipeline:latest
    container_name: news-pipeline-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_NAME: /data/dominican_news_repository.db
      CHROMA_PATH: /data/chroma_db
      DATA_DIR: /data/debug_json
      HF_HOME: /opt/hf_cache
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-8000}
      MCP_TRANSPORT: streamable-http
      MCP_API_KEY: ${MCP_API_KEY:-5cfb757b93c423b4bd8fcc6c65a5139304978503d5a1be38}
    volumes:
      - pipeline-data:/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.news-mcp.rule=Host(`${MCP_DOMAIN}`)
      - traefik.http.routers.news-mcp.entrypoints=web
      - traefik.http.services.news-mcp.loadbalancer.server.port=${MCP_PORT:-8000}
    command: ["python", "-m", "mcp_app.server"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', int(__import__('os').environ.get('MCP_PORT','8000'))), 2); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Always-on scheduler: daily ingest + preprocess every 15m via supercronic
  scheduler:
    build: .
    image: news-pipeline:latest
    container_name: news-pipeline-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_NAME: /data/dominican_news_repository.db
      CHROMA_PATH: /data/chroma_db
      DATA_DIR: /data/debug_json
      HF_HOME: /opt/hf_cache
      TZ: America/Santo_Domingo
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pipeline-data:/data
    command: ["/usr/local/bin/supercronic", "/app/deploy/crontab"]

volumes:
  pipeline-data:
    driver: local

networks:
  proxy:
    external: true
